name: Publicar site no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Baixar bibliotecas locais para navegação offline
        run: |
          mkdir -p vendor
          curl -fL --retry 3 https://aframe.io/releases/1.8.0/aframe.min.js -o vendor/aframe.min.js
          curl -fL --retry 3 https://cdn.jsdelivr.net/npm/webxr-polyfill@2.0.3/build/webxr-polyfill.min.js -o vendor/webxr-polyfill.min.js
          test -s vendor/aframe.min.js
          test -s vendor/webxr-polyfill.min.js

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
